name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Convertir owner a minúsculas
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./devops-frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/devops-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build y Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./devops-proyect
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/devops-proyect:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/Dev-Server.pem
          chmod 400 ~/.ssh/Dev-Server.pem
          ssh-keyscan ${{ secrets.SSH_IP }} >> ~/.ssh/known_hosts

      - name: Aplicar configuración de Kubernetes
        run: |
          ssh -i ~/.ssh/Dev-Server.pem \
            ${{ secrets.SSH_HOST_NAME }}@${{ secrets.SSH_IP }} "
              export KUBECONFIG=~/.kube/config &&
              cd ~/app/Project-Huellitas-Veterinary/K8s &&
              kubectl apply -f mariadb-deployment.yml &&
              kubectl apply -f backend-deployment.yml &&
              kubectl apply -f frontend-deployment.yml
            "

      - name: Reiniciar aplicaciones
        run: |
          ssh -i ~/.ssh/Dev-Server.pem \
            ${{ secrets.SSH_HOST_NAME }}@${{ secrets.SSH_IP }} "
              export KUBECONFIG=~/.kube/config &&
              kubectl rollout restart deployment/backend &&
              kubectl rollout restart deployment/frontend
            "

      - name: Esperar aplicaciones
        run: |
          ssh -i ~/.ssh/Dev-Server.pem \
            ${{ secrets.SSH_HOST_NAME }}@${{ secrets.SSH_IP }} "
              export KUBECONFIG=~/.kube/config &&
              kubectl rollout status deployment/backend --timeout=120s &&
              kubectl rollout status deployment/frontend --timeout=120s
            "