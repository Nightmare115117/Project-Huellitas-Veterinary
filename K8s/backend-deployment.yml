apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/nightmare115117/devops-proyect:latest
          imagePullPolicy: Always

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseZGC
                -XX:+ZGenerational
                -XX:MaxRAMPercentage=70.0
                -Xlog:gc*:file=/tmp/gc.log:time,uptime

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://mariadb:3306/huellitas_db

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: DB_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: DB_PASSWORD

            - name: AES_SECRET
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: AES_SECRET

            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: HMAC_SECRET